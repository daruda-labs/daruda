name: Set up the build toolchain
description: >-
  The declared Rust floor with clippy and rustfmt, the pinned Zig, locked dependencies,
  and the vendored GPUI check. Checkout stays in the job.
inputs:
  cache-key:
    description: Swatinem/rust-cache key; jobs building different trees keep separate caches.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read and verify the Rust floor
      id: rust
      shell: bash
      # Cargo metadata runs on the runner's toolchain: the floor read here
      # names the rust-toolchain.toml channel, which is not installed yet.
      env:
        RUSTUP_TOOLCHAIN: stable
      run: |
        version=$(bash scripts/rust-version.sh)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache rustup toolchain
      # On Windows, archiving the toolchains costs more than installing Rust.
      if: runner.os != 'Windows'
      uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-${{ steps.rust.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.rust.outputs.version }}
        components: clippy, rustfmt

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2.9.1
      with:
        key: ${{ inputs.cache-key }}

    - name: Cache Zig
      uses: actions/cache@v5
      with:
        path: .context/zig
        key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

    - name: Install Zig 0.14.1
      if: runner.os != 'Windows'
      shell: bash
      run: |
        ./scripts/bootstrap-zig.sh
        echo "$GITHUB_WORKSPACE/.context/zig/0.14.1" >> "$GITHUB_PATH"

    - name: Install Zig 0.14.1
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        ./scripts/bootstrap-zig.ps1
        Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\.context\zig\0.14.1"

    - name: Fetch locked dependencies and verify GPUI source
      shell: bash
      run: cargo fetch --locked && cargo run --locked -p vendor_gpui -- --check
