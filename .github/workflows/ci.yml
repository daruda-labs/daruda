name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint, test
    runs-on: macos-14  # Apple Silicon runner
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.14.1
        run: ./scripts/bootstrap-zig.sh

      - name: Add Zig to PATH
        run: echo "$GITHUB_WORKSPACE/.context/zig/0.14.1" >> "$GITHUB_PATH"

      - name: Fetch dependencies and apply GPUI patch
        run: cargo fetch && ./scripts/apply-gpui-patch.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow --all-targets -- -D warnings

      - name: Lint — inline literals
        run: ./scripts/lint-inline-literals.sh

      - name: Lint — paint scope
        run: ./scripts/lint-paint-scope.sh

      - name: Lint — reentrant reads
        run: ./scripts/lint-reentrant-reads.sh

      - name: Lint — gpui_component direct import
        run: ./scripts/lint-direct-gpui-component.sh

      - name: Lint — ferrum_flow direct access
        run: ./scripts/lint-direct-ferrum-flow.sh

      - name: Lint — no eprintln
        run: ./scripts/lint-no-eprintln.sh

      - name: Lint — viewport-row scroll dispatch
        run: ./scripts/lint-viewport-row-scroll.sh

      - name: Lint — platform capability boundary
        run: ./scripts/lint-platform-boundary.sh

      - name: Lint — daruda environment registry
        run: |
          ./scripts/lint-env-literals.sh --self-test
          ./scripts/lint-env-literals.sh

      - name: Lint — no silent update swallowing
        run: ./scripts/lint-no-silent-update.sh

      - name: Lint — single agent-activity source
        run: ./scripts/lint-agent-activity.sh

      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p daruda_flow -p daruda_core -p daruda_update -p ghostty_vt_sys -p ghostty_vt -p daruda_agent

      - name: Test
        run: cargo test -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p gpui_component

  linux:
    name: Linux — build and test
    runs-on: ubuntu-latest
    # Cold, and building the same tree the macOS job does on a slower
    # runner. Raise rather than let a real failure look like a timeout.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # gpui_linux draws through x11/wayland and shapes text through
      # fontconfig. Trimmed from zed's `script/linux` list — daruda has no
      # livekit (no libasound/libva) and shells out to git rather than
      # linking libgit2.
      # `fonts-noto-cjk` is not for the GUI — the mermaid measurer probes a
      # Hangul advance from the real font stack, and no font in the base image
      # covers Hangul. Latin faces are already there (`fonts-dejavu-core`
      # reports "already the newest version"), named anyway so the suite does
      # not silently depend on what the runner image happens to carry.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libglib2.0-dev \
            fonts-dejavu-core \
            fonts-noto-cjk

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: linux

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.14.1
        run: ./scripts/bootstrap-zig.sh

      - name: Add Zig to PATH
        run: echo "$GITHUB_WORKSPACE/.context/zig/0.14.1" >> "$GITHUB_PATH"

      - name: Fetch dependencies and apply GPUI patch
        run: cargo fetch && ./scripts/apply-gpui-patch.sh

      # No lint steps: those read source, not platform, and the macOS job
      # already ran them. What is unproven here is whether this tree
      # compiles and passes at all on Linux.
      # `--keep-going`: the first run stopped at the first crate that would
      # not compile, leaving every independent one after it unmeasured. No
      # Linux machine is available to find the rest locally, so a run that
      # reports one error costs the same wall clock as one reporting all of
      # them. (`--no-fail-fast` is `cargo test`'s spelling; `cargo clippy`
      # takes this one.)
      - name: Clippy
        run: cargo clippy --keep-going -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow --all-targets -- -D warnings

      # `--no-fail-fast` so one early failure does not hide the rest —
      # the point of the first run is the whole list.
      - name: Test
        run: cargo test --no-fail-fast -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p gpui_component

  windows:
    name: Windows — build and test
    runs-on: windows-latest
    # Slower than either other runner and building the ghostty Zig static lib
    # from scratch on top. Raise rather than let a real failure read as a
    # timeout.
    timeout-minutes: 60

    # Measures before it gates, the way the `linux` job did: no Windows machine
    # is available, so what actually breaks is unknown until a run says so.
    # Drop this once the list is empty.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: windows

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      # `bootstrap-zig.sh` refuses Windows on purpose — Git Bash carries no
      # dependable unzip. PowerShell has `Expand-Archive` and `Get-FileHash`,
      # so the shasum the script insists on is kept rather than dropped.
      # URL and digest are from ziglang.org's download index for 0.14.1.
      - name: Install Zig 0.14.1
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\.context\zig\0.14.1"
          if (Test-Path "$dest\zig.exe") { "Zig 0.14.1 already installed"; exit 0 }
          $url = "https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip"
          $want = "554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c"
          $zip = "$env:RUNNER_TEMP\zig.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "sha256 mismatch: got $got, want $want" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\zigout" -Force
          # Glob the extracted directory rather than spelling its name, so a
          # rename upstream surfaces as a missing zig.exe, not a wrong path.
          $inner = Get-ChildItem "$env:RUNNER_TEMP\zigout" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Move-Item $inner.FullName $dest
          & "$dest\zig.exe" version

      - name: Add Zig to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\.context\zig\0.14.1"

      # Git Bash: the patch script is bash, and three of its six patches target
      # platform-neutral gpui code, so Windows needs them as much as macOS.
      - name: Fetch dependencies and apply GPUI patch
        shell: bash
        run: cargo fetch && ./scripts/apply-gpui-patch.sh

      # No lint steps and no fmt, for the reason the `linux` job gives: those
      # read source, not platform. `--keep-going` / `--no-fail-fast` so one
      # early break does not hide the rest — the whole list is the point.
      - name: Clippy
        run: cargo clippy --keep-going -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow --all-targets -- -D warnings

      - name: Test
        run: cargo test --no-fail-fast -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p gpui_component
