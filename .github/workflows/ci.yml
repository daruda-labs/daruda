name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-changes:
    name: Select dependency packaging checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.changes.outputs.packaging }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select changed dependency and packaging paths
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            packaging=true
          else
            packaging=$(git diff --name-only --no-renames "$BASE" HEAD | bash scripts/check-packaging-changes.sh)
          fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    # Track the latest GitHub-hosted image for each platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Nothing here compiles: `cargo fmt` reads the source and the scripts are
    # greps. Split out so the answer arrives in seconds rather than behind a
    # platform build, and so a lint failure is not read as a test failure.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # No submodules: the ghostty tree is only wanted by a build script,
        # and the scans below never leave `packages/`, the vendored
        # `vendor/gpui-component/` and `vendor/ferrum-flow/`, and `scripts/`.

      - name: Verify dependency maintenance scripts and Rust floor
        id: rust
        run: |
          bash scripts/rust-version.sh --self-test
          bash scripts/check-packaging-changes.sh --self-test
          version=$(bash scripts/rust-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint — inline literals
        run: ./scripts/lint-inline-literals.sh

      - name: Lint — paint scope
        run: ./scripts/lint-paint-scope.sh

      - name: Lint — reentrant reads
        run: ./scripts/lint-reentrant-reads.sh

      - name: Lint — gpui_component direct import
        run: ./scripts/lint-direct-gpui-component.sh

      - name: Lint — text input factories
        run: |
          bash ./scripts/lint-input-factories.sh --self-test
          bash ./scripts/lint-input-factories.sh

      - name: Lint — authoring modal field profiles
        run: |
          bash ./scripts/lint-modal-fields.sh --self-test
          bash ./scripts/lint-modal-fields.sh

      - name: Lint — ferrum_flow direct access
        run: ./scripts/lint-direct-ferrum-flow.sh

      - name: Lint — no eprintln
        run: ./scripts/lint-no-eprintln.sh

      - name: Lint — viewport-row scroll dispatch
        run: ./scripts/lint-viewport-row-scroll.sh

      - name: Lint — landing view reads no disk
        run: ./scripts/lint-landing-no-disk-read.sh

      - name: Lint — platform capability boundary
        run: ./scripts/lint-platform-boundary.sh

      - name: Lint — daruda environment registry
        run: |
          ./scripts/lint-env-literals.sh --self-test
          ./scripts/lint-env-literals.sh

      - name: Lint — no silent update swallowing
        run: ./scripts/lint-no-silent-update.sh

      - name: Lint — single agent-activity source
        run: ./scripts/lint-agent-activity.sh

  macos:
    name: macOS — build and test
    needs: dependency-changes
    runs-on: macos-latest  # Apple Silicon runner
    # Cold builds need time for test compilation after Clippy and doc checks.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-build

      - name: Clippy
        shell: bash
        run: bash ./scripts/ci-cargo.sh clippy

      # Every app feature is off by default, so the clippy above never reads
      # what only `screenshot` or `replay` compiles. Check every feature on
      # each OS, even when its capture backend is unavailable at runtime.
      - name: Clippy (all app features)
        shell: bash
        run: bash ./scripts/ci-cargo.sh app-features

      - name: Doc links
        shell: bash
        run: bash ./scripts/ci-cargo.sh doc

      - name: Test
        shell: bash
        run: bash ./scripts/ci-cargo.sh test

      - name: Build and verify the macOS bundle
        if: needs.dependency-changes.outputs.packaging == 'true'
        timeout-minutes: 10
        run: |
          ./scripts/build-app.sh --profile debug
          target=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.target_directory')
          app="$target/debug/daruda.app"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$(bash scripts/version.sh)"
          test -x "$app/Contents/MacOS/daruda"
          data=$(mktemp -d)
          DARUDA_DATA_DIR="$data" "$app/Contents/MacOS/daruda" --smoke

  linux:
    name: Linux — build and test
    needs: dependency-changes
    runs-on: ubuntu-latest
    # Cold, and building the same tree the macOS job does on a slower
    # runner. Raise rather than let a real failure look like a timeout.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # `fonts-noto-cjk` is not for the GUI: the mermaid measurer probes a
      # Hangul advance from the real font stack, and the base image has none.
      - name: Install system dependencies
        run: >-
          ./scripts/linux/apt-install.sh scripts/linux/build-deps.txt
          scripts/linux/smoke-deps.txt fonts-noto-cjk

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-build
        with:
          cache-key: linux

      # No lint steps: those read source, not platform, and the `lint` job
      # already ran them. What is unproven here is whether this tree
      # compiles and passes at all on Linux.
      # `--keep-going`: the first run stopped at the first crate that would
      # not compile, leaving every independent one after it unmeasured. No
      # Linux machine is available to find the rest locally, so a run that
      # reports one error costs the same wall clock as one reporting all of
      # them. (`--no-fail-fast` is `cargo test`'s spelling; `cargo clippy`
      # takes this one.)
      - name: Clippy
        shell: bash
        run: bash ./scripts/ci-cargo.sh clippy --keep-going

      - name: Clippy (all app features)
        shell: bash
        run: bash ./scripts/ci-cargo.sh app-features

      # `--no-fail-fast` so one early failure does not hide the rest —
      # the point of the first run is the whole list.
      - name: Test
        shell: bash
        run: bash ./scripts/ci-cargo.sh test --no-fail-fast

      # Built once here so the two timed runs below only have to start it.
      - name: Build the desktop binary
        run: cargo build --locked -p daruda

      # What a build and a test never prove: that gpui's X11 and Wayland
      # clients come up and draw. Each is its own backend.
      - name: Smoke-test the window (X11)
        timeout-minutes: 5
        run: ./scripts/linux/smoke.sh x11 target/debug/daruda

      - name: Smoke-test the window (Wayland)
        timeout-minutes: 5
        run: ./scripts/linux/smoke.sh wayland target/debug/daruda

      - name: Install Linux packaging dependencies
        if: needs.dependency-changes.outputs.packaging == 'true'
        run: ./scripts/linux/apt-install.sh imagemagick dpkg-dev desktop-file-utils jq

      - name: Build Linux packages from the checked binary
        if: needs.dependency-changes.outputs.packaging == 'true'
        id: package
        run: |
          desktop-file-validate scripts/linux/daruda.desktop
          ./scripts/package-linux.sh --profile debug --skip-build

      - name: Verify the installed deb and extracted archive
        if: needs.dependency-changes.outputs.packaging == 'true'
        timeout-minutes: 5
        env:
          DEB: ${{ steps.package.outputs.deb }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          sudo apt-get install -y "$DEB"
          data=$(mktemp -d)
          DARUDA_DATA_DIR="$data" ./scripts/linux/smoke.sh x11 /usr/bin/daruda
          out=$(mktemp -d)
          tar -xzf "$ARCHIVE" -C "$out"
          bin=$(find "$out" -type f -name daruda | head -1)
          test -n "$bin"
          data=$(mktemp -d)
          DARUDA_DATA_DIR="$data" ./scripts/linux/smoke.sh x11 "$bin"

  windows:
    name: Windows — build and test
    needs: dependency-changes
    runs-on: windows-latest
    # Slower than either other runner and building the ghostty Zig static lib
    # from scratch on top. Raise rather than let a real failure read as a
    # timeout.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-build
        with:
          cache-key: windows

      - name: Clippy
        shell: bash
        run: bash ./scripts/ci-cargo.sh clippy --keep-going

      - name: Clippy (all app features)
        shell: bash
        run: bash ./scripts/ci-cargo.sh app-features

      - name: Add Git shell tools for runtime fixtures
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source -Parent) -Parent
          $tools = Join-Path $gitRoot 'usr/bin'
          if (-not (Test-Path (Join-Path $tools 'sh.exe'))) {
            throw 'Git for Windows POSIX tools are required by the runtime tests'
          }
          Add-Content $env:GITHUB_PATH $tools

      - name: Test
        shell: bash
        run: bash ./scripts/ci-cargo.sh test --no-fail-fast

      - name: Build native application
        run: ./scripts/build-windows.ps1

      # The one thing a build and a unit test cannot answer: whether gpui's
      # platform layer comes up on a runner with no GPU, where D3D11 falls
      # back to a software device. Exits non-zero if no window is drawn.
      - name: Smoke-test the GUI
        # A window that never comes up should fail here, not eat the job's
        # hour: the check itself settles in seconds.
        timeout-minutes: 5
        run: cargo run --locked -p daruda -- --smoke

      # Runs the packaging the release workflow depends on — the PE
      # architecture check and the MSVC redist lookup — without keeping the
      # archive: a debug build is not something to hand anyone, and a broken
      # script should fail here rather than at tag time.
      - name: Verify Windows packaging
        run: ./scripts/package-windows.ps1 -Profile debug -SkipBuild

      - name: Verify Windows package versions
        run: ./scripts/test-windows-package-version.ps1

  # ARM64 shares every source path with x86_64; what differs is the native
  # toolchain, the ghostty Zig target, and the arch-specific packaging. Only a
  # packaging-relevant change can break those, so only such a change runs it.
  windows-arm64:
    name: Windows ARM64 — build and package
    needs: dependency-changes
    if: needs.dependency-changes.outputs.packaging == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-build
        with:
          cache-key: windows-arm64

      - name: Build native application
        run: ./scripts/build-windows.ps1

      - name: Smoke-test the GUI
        timeout-minutes: 5
        run: cargo run --locked -p daruda -- --smoke

      - name: Verify Windows packaging
        run: ./scripts/package-windows.ps1 -Profile debug -SkipBuild
