name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint, test
    runs-on: macos-14  # Apple Silicon runner
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.14.1
        run: ./scripts/bootstrap-zig.sh

      - name: Add Zig to PATH
        run: echo "$GITHUB_WORKSPACE/.context/zig/0.14.1" >> "$GITHUB_PATH"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Verify vendored GPUI
        run: cargo run --locked -p vendor_gpui -- --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p vendor_gpui -p test_process --all-targets -- -D warnings

      - name: Lint — inline literals
        run: ./scripts/lint-inline-literals.sh

      - name: Lint — paint scope
        run: ./scripts/lint-paint-scope.sh

      - name: Lint — reentrant reads
        run: ./scripts/lint-reentrant-reads.sh

      - name: Lint — gpui_component direct import
        run: ./scripts/lint-direct-gpui-component.sh

      - name: Lint — ferrum_flow direct access
        run: ./scripts/lint-direct-ferrum-flow.sh

      - name: Lint — no eprintln
        run: ./scripts/lint-no-eprintln.sh

      - name: Lint — viewport-row scroll dispatch
        run: ./scripts/lint-viewport-row-scroll.sh

      - name: Lint — platform capability boundary
        run: ./scripts/lint-platform-boundary.sh

      - name: Lint — daruda environment registry
        run: |
          ./scripts/lint-env-literals.sh --self-test
          ./scripts/lint-env-literals.sh

      - name: Lint — no silent update swallowing
        run: ./scripts/lint-no-silent-update.sh

      - name: Lint — single agent-activity source
        run: ./scripts/lint-agent-activity.sh

      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p daruda_flow -p daruda_core -p daruda_update -p ghostty_vt_sys -p ghostty_vt -p daruda_agent

      - name: Test
        run: cargo test --locked -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p gpui_component -p vendor_gpui -p test_process

  linux:
    name: Linux — build and test
    runs-on: ubuntu-latest
    # Cold, and building the same tree the macOS job does on a slower
    # runner. Raise rather than let a real failure look like a timeout.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # gpui_linux draws through x11/wayland and shapes text through
      # fontconfig. Trimmed from zed's `script/linux` list — daruda has no
      # livekit (no libasound/libva) and shells out to git rather than
      # linking libgit2.
      # `fonts-noto-cjk` is not for the GUI — the mermaid measurer probes a
      # Hangul advance from the real font stack, and no font in the base image
      # covers Hangul. Latin faces are already there (`fonts-dejavu-core`
      # reports "already the newest version"), named anyway so the suite does
      # not silently depend on what the runner image happens to carry.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libglib2.0-dev \
            fonts-dejavu-core \
            fonts-noto-cjk

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: linux

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.14.1
        run: ./scripts/bootstrap-zig.sh

      - name: Add Zig to PATH
        run: echo "$GITHUB_WORKSPACE/.context/zig/0.14.1" >> "$GITHUB_PATH"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Verify vendored GPUI
        run: cargo run --locked -p vendor_gpui -- --check

      # No lint steps: those read source, not platform, and the macOS job
      # already ran them. What is unproven here is whether this tree
      # compiles and passes at all on Linux.
      # `--keep-going`: the first run stopped at the first crate that would
      # not compile, leaving every independent one after it unmeasured. No
      # Linux machine is available to find the rest locally, so a run that
      # reports one error costs the same wall clock as one reporting all of
      # them. (`--no-fail-fast` is `cargo test`'s spelling; `cargo clippy`
      # takes this one.)
      - name: Clippy
        run: cargo clippy --locked --keep-going -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p vendor_gpui -p test_process --all-targets -- -D warnings

      # `--no-fail-fast` so one early failure does not hide the rest —
      # the point of the first run is the whole list.
      - name: Test
        run: cargo test --locked --no-fail-fast -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p gpui_component -p vendor_gpui -p test_process

  windows:
    name: Windows — build and test
    runs-on: windows-latest
    # Slower than either other runner and building the ghostty Zig static lib
    # from scratch on top. Raise rather than let a real failure read as a
    # timeout.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: windows

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.14.1
        run: ./scripts/bootstrap-zig.ps1

      - name: Add Zig to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\.context\zig\0.14.1"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Verify vendored GPUI
        run: cargo run --locked -p vendor_gpui -- --check

      - name: Build native application
        run: ./scripts/build-windows.ps1

      - name: Check all app targets and screenshot feature
        run: cargo check --locked -p daruda --all-targets --features screenshot

      # The one thing a build and a unit test cannot answer: whether gpui's
      # platform layer comes up on a runner with no GPU, where D3D11 falls
      # back to a software device. Exits non-zero if no window is drawn.
      - name: Smoke-test the GUI
        # A window that never comes up should fail here, not eat the job's
        # hour: the check itself settles in seconds.
        timeout-minutes: 5
        run: cargo run --locked -p daruda -- --smoke

      - name: Add Git shell tools for runtime fixtures
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source -Parent) -Parent
          $tools = Join-Path $gitRoot 'usr/bin'
          if (-not (Test-Path (Join-Path $tools 'sh.exe'))) {
            throw 'Git for Windows POSIX tools are required by the runtime tests'
          }
          Add-Content $env:GITHUB_PATH $tools

      - name: Test native build contracts
        run: cargo test --locked -p ghostty_vt -p ghostty_vt_sys -p vendor_gpui -p test_process

      - name: Test Windows platform adapters
        run: 'cargo test --locked -p daruda platform::'

      - name: Test MCP transport and protocol
        run: 'cargo test --locked -p daruda control::mcp::'

      - name: Package Windows test build
        id: package
        run: ./scripts/package-windows.ps1 -Profile debug -SkipBuild

      - name: Upload Windows test build
        uses: actions/upload-artifact@v7
        with:
          name: daruda-windows-x86_64-debug
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Clippy
        run: cargo clippy --locked --keep-going -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p vendor_gpui -p test_process --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-fail-fast -p ghostty_vt -p ghostty_vt_sys -p daruda_terminal -p daruda -p daruda_config -p daruda_store -p daruda_agent -p daruda_update -p daruda_acp -p daruda_core -p daruda_flow -p ferrum_flow -p gpui_component -p vendor_gpui -p test_process
