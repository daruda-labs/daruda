name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version
    # Keep release metadata on the same Ubuntu image as CI.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -A20 '^\[workspace\.package\]' Cargo.toml \
            | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          test -n "$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-dmg:
    name: Build macOS dmg
    needs: metadata
    runs-on: macos-latest  # Apple Silicon runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: release

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.14.1
        run: ./scripts/bootstrap-zig.sh

      - name: Add Zig to PATH
        run: echo "$GITHUB_WORKSPACE/.context/zig/0.14.1" >> "$GITHUB_PATH"

      - name: Fetch locked dependencies and verify GPUI source
        run: cargo fetch --locked && cargo run --locked -p vendor_gpui -- --check

      - name: Build .app bundle
        run: ./scripts/build-app.sh

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create .dmg
        run: |
          create-dmg \
            --volname "daruda" \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "daruda.app" 150 180 \
            --app-drop-link 390 180 \
            --no-internet-enable \
            "daruda-${{ needs.metadata.outputs.version }}.dmg" \
            "target/release/daruda.app"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: daruda-${{ needs.metadata.outputs.version }}.dmg
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Build Windows x86_64 ZIP and installer
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache rustup toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.95-${{ runner.os }}-${{ runner.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: release-windows

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: .context/zig
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.14.1
        run: ./scripts/bootstrap-zig.ps1

      - name: Add Zig to PATH
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE/.context/zig/0.14.1"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Verify vendored GPUI
        run: cargo run --locked -p vendor_gpui -- --check

      - name: Prepare Windows signing identity
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          if (-not $env:SIGNING_PFX) {
            if ($env:SIGNING_REQUIRED -eq 'true') { throw 'Windows release signing is required but no certificate was provided' }
            'signed=false' | Add-Content $env:GITHUB_OUTPUT
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'daruda-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
            $password = if ($env:SIGNING_PASSWORD) {
              ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
            } else { [Security.SecureString]::new() }
            $certificates = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:/CurrentUser/My' -Password $password)
            $signers = @($certificates | Where-Object {
              $_.HasPrivateKey -and ($_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3')
            })
            if ($signers.Count -ne 1) { throw 'Expected one code-signing certificate with a private key' }
            "thumbprint=$($signers[0].Thumbprint)" | Add-Content $env:GITHUB_OUTPUT
            'signed=true' | Add-Content $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }

      - name: Build and package Windows application
        id: package
        run: ./scripts/package-windows.ps1 -CertificateThumbprint '${{ steps.signing.outputs.thumbprint }}'

      - name: Install pinned NSIS toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1') {
            throw 'NSIS archive checksum mismatch'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'nsis-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          (Join-Path $tools 'nsis-3.11') | Add-Content $env:GITHUB_PATH

      - name: Build per-user installer
        id: installer
        run: ./scripts/build-windows-installer.ps1 -Archive '${{ steps.package.outputs.archive }}' -CertificateThumbprint '${{ steps.signing.outputs.thumbprint }}'

      - name: Verify installation and removal
        timeout-minutes: 5
        run: ./scripts/test-windows-installer.ps1 -Installer '${{ steps.installer.outputs.installer }}'

      # The bytes that ship, not the ones that built them: a release-profile
      # failure would otherwise be found by whoever downloaded it. `--smoke`
      # opens the real window and exits non-zero if nothing is drawn.
      - name: Smoke-test the packaged build
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          Expand-Archive -LiteralPath '${{ steps.package.outputs.archive }}' -DestinationPath $out -Force
          $exe = Get-ChildItem $out -Recurse -Filter daruda.exe | Select-Object -First 1
          if (-not $exe) { throw 'the package contains no daruda.exe' }
          & $exe.FullName --smoke
          if ($LASTEXITCODE -ne 0) { throw "the packaged build did not start (exit $LASTEXITCODE)" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.installer.outputs.installer }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish platform packages
    needs: [metadata, build-dmg, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: packages

      # Digests cover the final bytes, including any Windows signatures.
      - name: Write checksums
        working-directory: packages
        # `daruda-*` rather than `*`, which would or would not include the
        # sums file depending on when the glob expanded.
        run: sha256sum daruda-* | tee SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "daruda v${{ needs.metadata.outputs.version }}"
          draft: false
          prerelease: ${{ contains(needs.metadata.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            packages/daruda-${{ needs.metadata.outputs.version }}.dmg
            packages/daruda-${{ needs.metadata.outputs.version }}-windows-x86_64.zip
            packages/daruda-${{ needs.metadata.outputs.version }}-windows-x86_64-setup.exe
            packages/SHA256SUMS.txt
          body: |
            ## macOS

            Download `daruda-${{ needs.metadata.outputs.version }}.dmg`, open it,
            and drag daruda.app to Applications.
            First launch: right-click daruda.app and select Open.
            If macOS still refuses, run `xattr -cr /Applications/daruda.app`.

            ## Windows (x86_64)

            Download `daruda-${{ needs.metadata.outputs.version }}-windows-x86_64-setup.exe`
            for a per-user installation with Start Menu and desktop shortcuts.
            Administrator permission is not required. Uninstalling preserves app data.
            Windows Authenticode signing enabled for this release: `${{ needs.build-windows.outputs.signed }}`.
            Unsigned downloads may show a Windows SmartScreen warning.
            Alternatively, extract the entire ZIP and run `daruda.exe`, keeping
            its included runtime DLLs beside it.
            Install Git for Windows to use repositories, shell flows, and agents.

            ## Verifying a download

            `SHA256SUMS.txt` holds a digest for each file above:
            `sha256sum -c SHA256SUMS.txt` (or `Get-FileHash`).
            For a signed Windows release, also verify `Get-AuthenticodeSignature`
            reports `Valid` and the expected publisher before installation.

            ## Build from source

            See [contributor setup](https://github.com/daruda-labs/daruda/blob/${{ github.ref_name }}/CONTRIBUTING.md#setup).
