[workspace]
resolver = "3"
members = [
    "packages/*",
    "tools/*",
    # Vendored third-party packages, one directory per upstream.
    "vendor/ferrum-flow/ferrum_flow",
    "vendor/gpui-kit/crates/base",
    "vendor/gpui-kit/crates/component",
    "vendor/gpui-kit/crates/assets",
    "vendor/gpui-kit/crates/component-macros",
]
exclude = ["vendor/zed"]

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/zed/crates/gpui" }

[workspace.package]
version = "0.2.20"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
description = "Run multiple AI agents in parallel, each in its own git worktree, from a single macOS terminal window."
repository = "https://github.com/daruda-ai/daruda"
homepage = "https://github.com/daruda-ai/daruda"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3" }
gpui_macros = { git = "https://github.com/zed-industries/zed", package = "gpui_macros", rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3" }
sum_tree = { git = "https://github.com/zed-industries/zed", package = "sum_tree", rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3" }
gpui_macos = { git = "https://github.com/zed-industries/zed", package = "gpui_macos", rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3", features = ["font-kit"] }
# zed's own OS-dispatch wrapper (`current_platform`/`application`) over
# gpui_macos/gpui_linux/gpui_windows — lets `bootstrap.rs` build the
# `gpui::Application` without `#[cfg(target_os = ...)]` of its own.
# `x11` / `wayland` select gpui_linux's window backends; zed's workspace turns
# its defaults off, so without them a Linux build opens no window at all.
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3", features = ["font-kit", "x11", "wayland"] }

daruda_acp = { path = "packages/acp" }
daruda_agent = { path = "packages/agent" }
daruda_config = { path = "packages/config" }
daruda_content = { path = "packages/content" }
daruda_control_types = { path = "packages/control-types" }
daruda_core = { path = "packages/core" }
daruda_flow = { path = "packages/flow" }
daruda_flow_edit = { path = "packages/flow-edit" }
daruda_project = { path = "packages/project" }
daruda_runlog = { path = "packages/runlog" }
daruda_settings = { path = "packages/settings" }
daruda_store = { path = "packages/store" }
daruda_terminal = { path = "packages/terminal" }
daruda_chat = { path = "packages/chat" }
daruda_transcript = { path = "packages/transcript" }
daruda_ui = { path = "packages/ui" }
daruda_update = { path = "packages/update" }
ghostty_vt = { path = "packages/ghostty-vt" }
ghostty_vt_sys = { path = "packages/ghostty-vt-sys" }
strings_gen = { path = "tools/strings_gen" }
test_process = { path = "tools/test_process" }

ferrum_flow = { path = "vendor/ferrum-flow/ferrum_flow" }
gpui_component = { package = "gpui-component", path = "vendor/gpui-kit/crates/component", features = ["tree-sitter-languages"] }
gpui-kit-assets = { path = "vendor/gpui-kit/crates/assets" }
gpui-base = { path = "vendor/gpui-kit/crates/base" }

# Shared registry dependencies, including the vendored widget packages.
agent-client-protocol = "5"
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4.38", default-features = false }
dirs = "7"
enum-iterator = "2.1.0"
# Preserve cloned FuturesUnordered waker identity (futures-rs#3032).
futures = "0.3.34"
hex = "0.4"
humantime = "2"
indoc = "2"
instant = { version = "0.1", features = ["wasm-bindgen"] }
itertools = "0.13"
markdown = { version = "1", features = ["serde"] }
num-traits = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false }
libc = "0.2.191"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = { version = "8.2.0", default-features = false }
portable-pty = "0.9"
pulldown-cmark = { version = "0.13.5", default-features = false }
raw-window-handle = "0.6"
regex = "1.10"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
rust-embed = { version = "8", features = ["include-exclude"] }
rust-i18n = "4"
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
sha2 = "0.11"
shell-words = "1"
similar = "3"
smallvec = { version = "1.15", features = ["const_new"] }
smol = "2"
syn = "2"
sysinfo = "0.40.1"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tracing = "0.1.41"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-yaml = "0.7.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
ureq = { version = "3", default-features = false }
url = "2"
uuid = "1.10"
which = "8"
windows = "0.58"
windows-sys = "0.61"
yaml_serde = "0.10"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Activates the clippy.toml `disallowed-methods` entries; without this the
# disallowed_methods lint stays allow-by-default and those entries never fire.
disallowed_methods = "deny"
# `debug_assert!` is stripped from release builds, so a state transition placed
# inside one silently stops happening where it matters. Not on by default at any
# level, so it has to be named here.
debug_assert_with_mut_call = "deny"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

# Mirror the dev settings for build scripts and proc-macros; otherwise every
# crate shared between host and target compiles twice.
[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = false

[profile.dev.package."*"]
# Dependency debug info dominates target/ size; workspace crates keep theirs,
# and backtraces still name dependency frames through the symbol table.
debug = false

[profile.dev.package]
# proc-macro and build-time-heavy crates compile at opt-level 3 even in dev.
gpui_macros = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[profile.release.package]
daruda = { codegen-units = 16 }

# Fast iteration / perf harness: release optimizations without the slow link.
[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16
