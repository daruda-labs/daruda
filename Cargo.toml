[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "Run multiple AI agents in parallel, each in its own git worktree, from a single macOS terminal window."
repository = "https://github.com/daruda-labs/daruda"
homepage = "https://github.com/daruda-labs/daruda"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "cff3ac6f93f506330034652f0d2389591bfb45a0" }
gpui_macros = { git = "https://github.com/zed-industries/zed", package = "gpui_macros", rev = "cff3ac6f93f506330034652f0d2389591bfb45a0" }
sum_tree = { git = "https://github.com/zed-industries/zed", package = "sum_tree", rev = "cff3ac6f93f506330034652f0d2389591bfb45a0" }

gpui_component = { path = "crates/gpui_component" }
gpui_component_macros = { path = "crates/gpui_component_macros" }
gpui_component_assets = { path = "crates/gpui_component_assets" }

smallvec = { version = "1.15", features = ["const_new"] }

# Vendored gpui-component v0.5.1 transitive deps
anyhow = "1"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "3"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smol = "2"
tracing = "0.1.41"
rust-embed = "8"
