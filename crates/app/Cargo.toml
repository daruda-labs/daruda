[package]
name = "daruda"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
description = "Loop Terminal — Dev loop accelerator for Claude Code"

[[bin]]
name = "daruda"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs4 = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ghostty_vt = { path = "../ghostty_vt" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
daruda_claude = { path = "../daruda_claude" }
daruda_store = { path = "../daruda_store" }
daruda_config = { path = "../daruda_config" }
daruda_terminal = { path = "../daruda_terminal" }
gpui = { workspace = true }
gpui_component = { workspace = true }
gpui_component_assets = { workspace = true }
ignore = "0.4"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSThread"] }
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = "0.45"
rust-i18n = { workspace = true }
sys-locale = "0.3"
schemars = { workspace = true }
sysinfo = "0.32"
tempfile = "3"
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-themes", "parsing", "regex-onig"] }
toml = "0.8"
two-face = "0.5.1"
unicode-segmentation = "1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
serde_json = "1"
