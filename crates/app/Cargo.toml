[package]
name = "daruda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Loop Terminal — Dev loop accelerator for Claude Code"

[lints]
workspace = true

[[bin]]
name = "daruda"
path = "src/main.rs"

[features]
# `daruda --screenshot <path>` — render the live window to a PNG via gpui's
# render_to_image (upstream-gated behind test-support). Off by default to keep
# the shipping binary clean; enable for visual-verification builds:
#   cargo build -p daruda --features screenshot
screenshot = ["gpui/test-support", "gpui_macos/test-support"]

[dependencies]
daruda_core = { path = "../daruda_core" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs4 = "0.13"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ghostty_vt = { path = "../ghostty_vt" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
daruda_acp = { path = "../daruda_acp" }
daruda_agent = { path = "../daruda_agent" }
daruda_store = { path = "../daruda_store" }
daruda_config = { path = "../daruda_config" }
daruda_terminal = { path = "../daruda_terminal" }
daruda_update = { path = "../daruda_update" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui_component = { workspace = true }
gpui_component_assets = { workspace = true }
ignore = "0.4"
imara-diff = "0.2"
lsp-types = { workspace = true }
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = "0.45"
selkie-rs = { version = "0.3", default-features = false }
rust-i18n = { workspace = true }
semver = "1"
sys-locale = "0.3"
schemars = { workspace = true }
sysinfo = "0.32"
tempfile = "3"
similar = "2"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
unicode-segmentation = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
uuid = { version = "1.10", features = ["v4"] }
open = "5.3.5"
which = "6"
nucleo-matcher = "0.3.1"

# OS APIs daruda calls directly, beyond what `gpui_platform` already selects
# for the window/rendering backend — dock/taskbar attention, idle time,
# Keychain-equivalent secret storage. See crates/app/src/platform/attention.rs
# and crates/app/src/telegram/keychain.rs for the call sites. `gpui_macos` is
# also listed here (not just pulled transitively via `gpui_platform`) because
# the `screenshot` feature below references `gpui_macos/test-support` directly.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSThread"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `screensaver` is the X11 extension attention.rs queries for system idle time
# (XScreenSaverQueryInfo); `allow-unsafe-code` is required by x11rb's FFI shims.
# Already in the dependency tree via gpui_platform -> gpui_linux's x11 feature,
# so this only turns on one more extension — no new crate download.
x11rb = { version = "0.13.1", features = ["screensaver", "allow-unsafe-code"] }
# No Linux-specific feature needed — notify's inotify backend is unconditional;
# `macos_fsevent` is the only opt-in OS backend (default-enabled upstream,
# hence disabling default-features + opting back in only on macOS above).
notify = { version = "7", default-features = false }

[dev-dependencies]
agent-client-protocol = "1.0"
gpui = { workspace = true, features = ["test-support"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { workspace = true, features = ["test-support"] }
