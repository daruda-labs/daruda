# Agent chat pane (ACP)
agent_chat:
  queue_full: "That chat already has too many prompts waiting. Wait for it to catch up."
  # Heading for an inline permission card.
  # Toast title for a non-fatal session advisory (`AcpEvent::Notice`): the
  # session is live, but something the user or their config asked for did not
  # happen. The body is the adapter's own diagnostic and stays untranslated.
  session_notice: "The session continued, but not as configured"
  # Body for the one notice daruda authors itself: the agent delegated through
  # its legacy path, so the subagent's work can never be shown.
  legacy_delegation_notice: "This agent delegated to a subagent without native subagent sessions, so the subagent's own tool calls will not appear. Its adapter may not support them, or may not read the Environment in Settings → Agents & Chat."
  # Closes a diff cut short by the inline fallback. Names the count and points
  # at the file, since the fallback has no scroller to reach the rest with.
  diff_fallback_truncated: "%{n} more lines — open the file to see the rest"
  # Label for the button an agent-chat pane offers when its failure is one a
  # fresh sign-in actually fixes (`daruda_acp::Remedy::Reauthenticate`).
  # Deliberately distinct from the Settings row's label: here the user is
  # recovering a session, not administering accounts.
  sign_in_again: "Sign in again"
  # Tooltip on a mermaid diagram card's zoom button, which opens the lightbox.
  diagram_zoom: "Enlarge diagram"
  # Tooltip on a mermaid diagram card's copy button — it copies the diagram
  # source, not the rendered image.
  diagram_copy: "Copy diagram source"
  # Tooltip on a mermaid diagram card's copy button right after a copy.
  diagram_copied: "Copied"
  # Enabled state of a boolean session config option (e.g. "Fast mode"), used
  # as both the chip label and its dropdown entry. The protocol carries only a
  # `bool`, so the two labels are the host's to supply.
  config_boolean_on: "On"
  # Disabled state of a boolean session config option — see
  # [`agent_chat_config_boolean_on`].
  config_boolean_off: "Off"
  config_default_model: "Default (%{model})"
  session_mode_chip: "Session: %{value}"
  config_chip: "%{name}: %{value}"
  # Tab / pane-header title for an Agent chat pane.
  tab_title: "Agent"
  # Banner copy for a dormant (restored, not-yet-connected) Agent chat pane.
  # The session starts on first focus, so this shows only for a visible but
  # unfocused pane.
  idle: "Idle — focus this pane to start the agent."
  # Placeholder copy shown while the agent session is connecting, before any
  # handshake milestone has been reported yet.
  connecting: "Connecting…"
  # Status banner shown while `initialize` is in flight (awaiting the agent's
  # capabilities reply).
  connecting_handshake: "Connecting — waiting for the agent to respond…"
  # Status banner shown while `session/new` is in flight (fresh session).
  connecting_creating_session: "Connecting — starting a new session…"
  # Status banner shown while `session/load` is in flight (resuming a
  # persisted session).
  connecting_loading_session: "Connecting — resuming your conversation…"
  # Status banner shown while `session/set_mode` is in flight, applying the
  # configured initial mode to a freshly created session.
  connecting_applying_mode: "Connecting — applying session mode…"
  # Status banner shown while the app is downloading the Node.js runtime the
  # agent adapter needs (first run on a machine without a usable Node.js).
  runtime_downloading: "Setting up the agent runtime — downloading Node.js (first run only)…"
  # Status banner shown while the downloaded Node.js runtime is being verified.
  runtime_verifying: "Setting up the agent runtime — verifying download…"
  # Status banner shown while the downloaded Node.js runtime is being extracted.
  runtime_extracting: "Setting up the agent runtime — extracting…"
  # Prefix for the connection-error status line.
  error_prefix: "Connection error:"
  transport_closed: "The connection to the agent was closed. Retry to reconnect."
  adapter_install_failed: "Could not prepare the agent package. Check the error details, then retry."
  adapter_setup_required: "Could not prepare the agent package. Check the error details and correct the package or runtime configuration before reconnecting."
  adapter_integrity_failed: "The agent package failed integrity verification and was not started. Check the error details and the package source."
  adapter_preparation_canceled: "Agent preparation was canceled."
  # Error-line reason set when the connection's event stream closes while the
  # pane is still `Connecting`/`Handshaking`/`PreparingRuntime` — no
  # `Connected`/`Error` ever arrived, so nothing else would surface a failure.
  # The renderer prepends the error prefix, so this is the bare reason.
  error_stream_ended: "the agent process ended before the connection was ready."
  # Label for the "Retry" button shown in the Error status banner.
  retry: "Retry"
  # Status-line reason shown when an Agent chat pane has no resolvable lane
  # working directory to attach a session to. The renderer prepends the error
  # prefix, so this is the bare reason (not itself prefixed).
  no_lane_cwd: "No working directory for this worktree."
  # Status-line reason shown when an Agent chat pane's command carries the
  # legacy `{{cwd}}` token (`AgentLaunch::needs_remote_cwd`) but the lane has
  # no `remote_cwd` configured. The one launch shape the lane's
  # `session_host` axis doesn't cover (see `session_host::adapter_command`'s
  # doc). `remote_cwd` is a per-lane persisted-state field
  # (`daruda_store::project::SerializedLane`, not `config.toml`) with no
  # editor anymore (the Session Host dialog never writes it), so the only
  # real fix is dropping the token from the command and setting the host on
  # the lane instead — this message names that, rather than a config key
  # that doesn't exist. Unlike `agent_chat_no_lane_cwd`, this names the fix
  # rather than just stating the symptom.
  no_remote_cwd: "This agent's command still uses the legacy {{cwd}} placeholder, which has no editor anymore. Remove {{cwd}} from the command in Settings → Agents & Chat, then set the host on this Worktree instead (right-click it in the sidebar → \"Session Host…\")."
  # Status-line reason shown when a lane's Session Host resolves to a remote
  # host (`Ssh`/`Docker`) but the pane's launch is a JSON stdio config —
  # `session_host::wrap` can only fold a shell command line into `ssh`/
  # `docker`, and injecting raw JSON there produces something the remote
  # shell can't execute. See `AgentLaunch::is_json_stdio`'s doc.
  json_stdio_remote_unsupported: "This agent's command is a JSON stdio config, which can't be sent to a remote host as a shell command. Switch this Worktree's Session Host to Local, or change the command to a plain shell command line."
  # Status-line reason shown when the pane's launch is a JSON stdio config and
  # its agent (or account) declares an environment. Every transport applies an
  # environment as shell text, which would stop the command being JSON; the
  # config's own `env` field is the lossless place for it, so the message
  # names that rather than just refusing. See
  # `agent::launch_resolve::json_stdio_refusal`.
  json_stdio_env_unsupported: "This agent runs from a JSON stdio config, so daruda cannot add an environment to it — the environment would have to be prepended as shell text, which stops the command being JSON. Move the variables into the config's own \"env\" field, or clear the Environment field in Settings → Agents & Chat."
  # Connect refused because the worktree's session host holds a value the
  # launch quoting cannot carry. `reason` is the session-host validator's own
  # wording, so the pane says the same thing the form would have.
  session_host_unusable: "This Worktree's session host can't be put into a launch command — %{reason} Fix it in the Worktree's \"Session Host…\" dialog, in Settings → Session Hosts, or in the agent's host field, then connect again."
  # Connect aborted because the pane's managed account config dir could not
  # be prepared. The connect does not silently fall back to another account,
  # so this names a real blocker rather than a warning.
  account_prepare_failed: "Could not prepare the selected account's configuration directory."
  # Hint appended to a connection error when the pane's working directory is
  # a remote (SSH/Docker) path. Guides the user to check the remote path
  # configuration and network connectivity.
  remote_connect_error_hint: "This looks like a remote (SSH/Docker) connection failure — check this Worktree's \"Session Host…\" setting in the sidebar (or, for an agent command still using the legacy {{cwd}} placeholder, edit that command in Settings → Agents & Chat) and that the host/container is reachable."
  # Empty-conversation hint shown before the first message.
  empty: "Ask the agent anything to get started."
  # Toolbar button: expand every foldable block in the conversation.
  expand_all: "Expand all"
  # Toolbar button: collapse every foldable block in the conversation.
  collapse_all: "Collapse all"
  # Toolbar button tooltip when clicking will enable reading-width mode.
  reading_width_on: "Use reading width"
  # Toolbar button tooltip when clicking will return to full-width mode.
  reading_width_off: "Use full width"
  # Tooltip on a diff block's header path — clicking opens it in the file
  # viewer.
  diff_open_in_file_view: "Open in file view"
  # Tooltip on a diff block header's "open externally" button when no preferred
  # external editor is configured — the click hands the path to the OS default
  # handler, which has no name to show.
  diff_open_externally: "Open externally"
  # Tooltip on a diff block header's "open externally" button when a preferred
  # external editor is configured. `editor` is the preset's own display name
  # (a proper noun — not localized).
  diff_open_in_editor: "Open in %{editor}"
  # Tooltip on a diff block header's copy-path button.
  diff_copy_path: "Copy path"
  # Tooltip on a diff block header's copy-path button right after a click.
  diff_path_copied: "Copied"
  # Error toast when "open in file view" / "open externally" is clicked on a
  # diff whose pane's session runs on a remote host — the path is on that
  # remote filesystem, not this machine's, so opening it locally would either
  # fail or (worse) show an unrelated local file at the same path.
  diff_remote_path_unsupported: "Can't open a remote session's file locally."
  # Tooltip on the activity-bar title showing the session's last-activity time
