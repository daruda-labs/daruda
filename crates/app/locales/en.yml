  context_tooltip: "Context: %{used} / %{size} tokens (%{percent}%)"
  # Same tooltip for a session whose agent also reports cumulative cost. Its own
  # pattern, so the separator and where the amount sits relative to the fill
  # stay translator decisions.
  context_tooltip_with_cost: "Context: %{used} / %{size} tokens (%{percent}%) · %{amount} %{currency}"
  # Section label for the bottom plan region.
  plan_label: "Plan"
  # Tooltip on the × button that dismisses a completed plan region.
  plan_dismiss: "Dismiss plan"
  # Working-indicator label for the number of subagents running right now.
