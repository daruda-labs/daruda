# Flow engine — picker, validation results, run outcomes
flow:
  # Prompt when the picker is choosing a flow to draw.
  picker_prompt_graph: "Show which flow?"
  picker_prompt_run: "Run which flow?"
  picker_prompt_validate: "Check which flow?"
  # Marks a flow that is the person's own rather than the repository's.
  # Only the global ones are tagged — tagging both would be noise on every
  # row in the ordinary case.
  # The row action on a run that was killed. "Continue", not "run again":
  # what already passed is not run a second time.
  resume_action: "Continue"
  # Asked before continuing, because the node the crash interrupted starts
  # over — whatever it had already done to the working tree or the machine,
  # it does again.
  resume_confirm_title: "Continue this run?"
  resume_confirm_body: "Nodes that already passed will not run again. The node the crash interrupted starts over, so anything it had already done — commands it ran, files it edited — it does again."
  resume_refused: "This run cannot be continued"
  picker_global: "global"
  # The first row of the profile list: the flow as its file is written.
  # Declaring a profile must not take the base run away.
  picker_profile_defaults: "defaults"
  # The prompt over the profile list.
  picker_prompt_profile: "Run %{flow} as…"
  picker_empty: "No flows here yet — add one under .daruda/flows/"
  # Shown when the active lane has no flow running. Says "this lane"
  # deliberately: a run in another lane is still going, and the status bar
  # chip is what says so.
  panel_empty: "No flow is running in this worktree"
  # Said under a question when more are behind it. Without it a person
  # answers, sees a different question appear, and cannot tell whether they
  # answered the wrong one.
  more_questions_waiting: "%{n} more waiting"
  # The modal's way out that is not an answer. Names the object because
  # "Stop" alone, beside three answer buttons, reads as stopping the tool
  # call rather than the run.
  ask_modal_stop: "Stop the flow"
  panel_stop: "Stop"
  # Title of the modal that brings a parked question to the front.
  ask_modal_title: "A flow is asking permission"
  # A file operation that failed. The detail is the file system's own words.
  file_op_failed: "%{path}: %{detail}"
  # What a graph pane says once its file has been deleted under it.
  file_gone: "This flow file was deleted."
  # The body a graph pane shows in place of the flow it cannot draw. The
  # detail is the file system's or the parser's own words — not translatable,
  # and the sentence around them is what makes them a sentence.
  graph_read_failed: "%{path} could not be read: %{detail}"
  graph_parse_failed: "This file is not a flow: %{detail}"
  # Chip on an agent node in the flow graph.
  graph_kind_agent: "AGENT"
  # What an empty agent box resolves to. Shown as the box's placeholder, so
  # "blank" reads as "inherits this" rather than as "nothing".
  form_inherited: "%{value} (from defaults)"
  form_id_invalid: "letters, digits, - and _ only"
  # A name the engine could not use. Says the rule rather than only refusing:
  # the person is looking at the box and needs to know what to type instead.
  # Label on the turn-cap box. Says "prompts" rather than "turns": a turn is
  # the protocol's word and a prompt is what the person is capping.
  form_turns_label: "Prompts per attempt"
  form_turns_unreadable: "%{text} is not a count of prompts"
  # Why a card's pin went away, one reason per function.
  #
  # Five plain functions rather than one taking the reason: `surface` imports
  # nothing from `workspace`, and the enum is the pane's. The pane matches; this
  # only words.
  graph_unpinned_node_changed: "unpinned — edited"
  graph_unpinned_node_gone: "unpinned — node gone"
  graph_unpinned_upstream: "unpinned — %{node} changed"
  graph_unpinned_inherited: "unpinned — defaults changed"
  graph_unpinned_unreadable: "unpinned — could not compare"
  graph_unpinned_source_gone: "unpinned — the run it came from is gone"
  # How many rules a card's node breaks. The count only — which rules is the
  # inspector's to say, and the card has no room for a sentence.
  graph_issue_count: "%{count} issue(s)"
  # Chip on a command node — a gate whose exit code is the verdict.
  graph_kind_gate: "GATE"
  graph_status_running: "running"
  # Second or later attempt. The first is not worth saying — every node has
  # one, and saying it on every card buries the card that says "3".
  graph_status_attempt: "attempt %{attempt}"
  graph_status_passed: "passed"
  graph_status_failed: "failed"
  graph_status_fixing: "repairing"
  # A node whose output this run will reuse rather than compute. On the badge
  # line because that line answers "what happens next", and for a pinned node
  # the answer is nothing.
  graph_status_pinned: "reused"
  # A node that retries itself, shown when the run is not driving it.
  # How many attempts a node's failure policy allows. Beside the retry glyph,
  # which is what says the policy exists at all.
  graph_policy_attempts: "×%{max}"
  # Label on the dashed edge a gate's repair sends back.
  graph_rerun_edge: "rerun"
  # Heading over the panel's list of flow files — the ones this lane can run,
  # as opposed to the runs below it.
  panel_flows_heading: "Flows"
  panel_flows_empty: "No flow files in this worktree or your own folder"
  # Title of the dialog that asks what to call a new flow.
  new_title: "New flow"
  new_placeholder: "Name, e.g. ship"
  new_tooltip: "New flow"
  rename_title: "Rename flow"
  row_menu_rename: "Rename…"
  row_menu_delete: "Delete…"
  # Confirmation before a flow file is removed. Names the file, because the
  # menu was opened on a row and the dialog is what the person reads.
  delete_confirm_title: "Delete this flow?"
  delete_confirm_body: "%{name} (%{origin}) will be removed from disk. Runs it already made are kept."
  # The repository's copy. Separate because the consequence is different: it is
  # in the working tree, so the deletion is something the whole repo sees.
  delete_confirm_body_repo: "%{name} is committed with this repository, so removing it changes the working tree and everyone who opens the repo loses it once that lands. Runs it already made are kept."
  # The button that answers the question. Not the menu's label: an ellipsis on a
  # menu item promises a question, and this *is* the question.
  delete_confirm_ok: "Delete"
