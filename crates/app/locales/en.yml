# Wall-clock timestamp shapes (`chrono` patterns). en-US reads on a 12-hour
# clock; see `surface::timestamp`.
timestamp:
  # `chrono` pattern for a full date and time. A pattern rather than plain
  # copy: field order, clock convention and the words around the numbers all
  # differ per locale. Consumed by [`crate::surface::timestamp`], not at call sites.
  date_and_time: "%b %-d, %Y, %-I:%M %p"
  # `chrono` pattern for a time of day alone — a stamp whose date the
  # surrounding UI already implies.
  time_only: "%-I:%M %p"
  # `chrono` pattern for a month, day and time — a timestamp whose year the
  # surrounding UI already implies.
  month_day_and_time: "%b %-d, %-I:%M %p"

