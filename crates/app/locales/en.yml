# External control surface — the command replies sent back to a phone
control:
  # Heading above a `/list` reply.
  listing_header: "Open agent chats"
  # One `/list` row. `agent` names the agent the pane runs, `detail` is the
  # pre-formatted activity-and-title segment (empty when it has neither), and
  # `ago` the last-activity suffix (empty when unknown).
  listing_row: "%{ordinal}. %{name} (%{agent})%{detail}%{ago}"
  # The agent line of a remote message about a chat in a tab the user named.
  agent_with_tab: "%{agent} · %{tab}"
  # Lead line of the phone message a turn that ended in an error sends.
  turn_failed: "⚠️ The agent stopped with an error"
  run_summary: "✅ %{segments}"
  # What a row's dash introduces, separator included. Omitted entirely when
  # there is nothing to introduce.
  listing_detail: " — %{detail}"
  # The activity glyph as it sits beside a session title.
  listing_state: "[%{state}]"
  # How a chosen target is named back to the user: its lane path plus its title.
  # A separate key from the listing row because the separator is a translator's
  # call, not a call site's.
  target_label: "%{name}%{title}"
  # How a lane is addressed on a listing row.
  lane_path: "%{project}/%{lane}"
  # Last-activity suffix on a `/list` row; `span` comes from
  # [`format_duration_compact`].
  listing_ago: " · %{span} ago"
  # Trailing line when a listing was cut to fit Telegram's message limit.
  listing_omitted: "…and %{count} more"
  listing_empty: "No agent chats are open."
  # Answer to a button tapped on a listing a newer one has superseded. Distinct
  # from the permission-prompt's stale wording — the two are different objects
  # and the phone has no other way to tell them apart.
  listing_stale: "That list is out of date. Send /list again."
  state_idle: "○"
  state_working: "▸"
  state_awaiting_permission: "❗"
  state_error: "✕"
  # Label on a `/list` row's inline button.
  button_label: "%{ordinal}"
  selected: "Target: %{name}"
  selection_cleared: "Target cleared."
  # Said when the target was cleared *for* the user because the pane vanished,
  # rather than because they asked. Without it the next plain message goes
  # somewhere unexpected with no warning.
  selection_dropped: "That chat is gone, so the target was cleared."
  sent_delivered: "Sent."
  sent_queued: "Queued behind the current turn."
  # Said when the text was a local slash command the pane ran itself instead of
  # sending. Named rather than folded into "sent", because today's only such
  # command is `/clear`, which resets the session.
  sent_handled_locally: "Ran in the app — the agent was not prompted."
  stopped: "Stopped."
  stop_already_idle: "Nothing was running."
  brief: "%{working} working · %{awaiting} waiting · %{error} failed · %{total} open"
  flow_list_row: "%{name} (%{origin})"
  flow_list_empty: "No flows are available in this worktree."
  flow_finished_notice: "Flow finished."
  # Told to the phone when a run it asked for was stopped.
  flow_canceled_notice: "Flow stopped."
  # Told to the phone when a run it asked for ended badly in a way whose
  # detail lives in the run report — which only the desktop can open.
  flow_failed_notice: "Flow failed. The run report is in daruda."
  # Told to the phone when the engine refused the run outright. `reason` is
  # the same already-localized wording the desktop toast shows, so the two
  # surfaces cannot drift apart about one outcome.
  flow_refused_notice: "Flow did not run: %{reason}"
  flow_origin_repo: "repo"
  flow_origin_project: "project"
  flow_origin_global: "global"
  # Said when a flow start was accepted. Deliberately not "started": the
  # engine takes its lock after this answer is sent, so the run can still be
  # refused. It promises the outcome instead, which
  # `Workspace::settle_flow_run` then delivers.
  flow_starting: "Starting %{name}. You'll get the outcome when it ends."
  error_unknown_command: "Unknown command: /%{input}"
  error_unknown_command_did_you_mean: "Unknown command: /%{input} — did you mean /%{suggestion}?"
  error_missing_argument: "Missing argument. %{usage}"
  error_ordinal_not_found: "No chat at %{ordinal}. Send /list for the current numbering."
  error_bad_ordinal: "Not a number: %{input}"
  error_no_target: "No target. Send /list, then /use <number>."
  error_target_gone: "That chat is gone. Send /list for the current numbering."
  error_flow_not_found: "No flow named %{name}. Send /flow to list them."
  error_flow_locked: "A flow is already running in this worktree."
  error_flow_refused: "%{name} will not run as written. Validate it in daruda."
  # Said when the flow itself is fine but no run appeared. Points at daruda
  # rather than at the file, because the static check already cleared the file
  # and the actual reason is in a toast only the desktop shows.
  error_flow_not_started: "%{name} did not start. daruda has the reason."
  error_flow_needs_interaction: "%{name} asks a question only the desktop can answer."
  error_no_active_lane: "No active worktree."
  usage_use: "Usage: /use <number> or /use -"
  usage_say: "Usage: /say <number> <message>"
  approval_lane_create: "daruda wants to create the worktree %{name}. Allow?"
  approval_chat_new: "daruda wants to open another chat in %{path}. Allow?"
  approval_allow: "Allow"
  approval_refuse: "Refuse"
  approval_already_answered: "Already answered"
  approval_allowed: "Allowed"
  approval_refused: "Refused"
  lane_listing_empty: "No worktrees are open."
  lane_listing_row: "%{path} — %{chats} chat(s)"
  lane_created: "Worktree created."
  chat_created: "Chat opened."
  # The ping that introduces a chat the phone approved opening; `agent` is
  # the display name of the agent running it.
  chat_announced: "A new %{agent} tab is open. Messages you send now go to it. /use - to go back to the orchestrator."
  # Told to a sender whose message named no chat and whose bridge remembered
  # none, so the app's own focused lane took it: which chat that was, and how
  # to pick another. `name` is the lane's path, `agent` the display name of
  # the agent running it.
  target_lent: "No chat was picked, so this went to %{name} (%{agent}). Send /list to pick another."
  transcript_empty: "That chat has not said anything yet."
  flow_stopped: "Stopped it."
  answer_none: "It finished without saying anything."
  answer_failed: "That run ended in an error."
  answer_interrupted: "That was stopped before it answered."
  answer_still_working: "Still working. I'll have the answer once it finishes."
  flow_stop_already_idle: "No flow was running there."
  error_approval_refused: "Refused."
  error_approval_timed_out: "That went unanswered, so nothing was created."
  error_agent_limit_reached: "The agent has created as many worktrees as it may this run."
  error_queue_full: "That chat already has too many prompts waiting."
  error_lane_create_failed: "The worktree could not be created. daruda has the reason."
  error_lane_name_invalid: "That is not a usable branch name."
  error_approvals_pending: "Too many approvals are already waiting. Answer one first."
  error_approval_unavailable: "daruda could not ask for approval — the Telegram bridge is off or unpaired."
  error_lane_create_busy: "A worktree is already being created in that repository. Try again in a moment."
  error_self_target_refused: "That would have the agent prompt itself."
  usage_daruda: "Usage: /daruda <what you want>"
  ask_accepted: "On it. You'll get the answer when it's ready."
  ask_accepted_connecting: "On it — starting the orchestrator first, so the first answer takes a little longer."
  error_orchestrator_disabled: "The orchestrator is off. Turn it on in daruda's Notifications settings."
  error_orchestrator_unresolvable: "The orchestrator names an agent daruda cannot run. Pick one in Settings."
  error_orchestrator_unavailable: "The orchestrator would not start. daruda has the reason."
  # Registered with Telegram, not translated: BotFather parses these as
  # `name - description`, and the names must match what control::spec accepts.
  # The `/setcommands` block a user pastes into BotFather. Fixed English —
  # it is registered with Telegram, not shown in daruda's own UI.
  botfather_commands: |-
    list - Open agent chats
    use - Select a target
    say - Send to a target
    stop - Stop the running turn
    flow - Run or list flows
    brief - One-line summary
    daruda - Ask daruda in plain words
