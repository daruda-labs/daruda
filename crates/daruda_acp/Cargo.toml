[package]
name = "daruda_acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "ACP (Agent Client Protocol) client core — spawns an ACP agent adapter and bridges its async connection to daruda (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_core = { path = "../daruda_core" }
agent-client-protocol = "2.0"
anyhow = { workspace = true }
futures = "0.3"
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
shell-words = "1"
smol = { workspace = true }
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
which = "6"

[dev-dependencies]
tempfile = "3"
