[package]
name = "daruda_config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "TOML configuration loader for daruda"

[lints]
workspace = true

[dependencies]
daruda_store = { path = "../daruda_store" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
