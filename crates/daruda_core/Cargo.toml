[package]
name = "daruda_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Shared utilities and core logic for daruda — usable from both the GPUI app and the GPUI-free protocol crates"

[lints]
workspace = true

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dunce = "1"
which = "6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
test_process = { path = "../../tools/test_process" }
