[package]
name = "daruda_flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Declarative flow engine over ACP — parses, validates and runs a DAG of agent and command nodes (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_acp = { path = "../daruda_acp" }
# The record says when each attempt settled. Already in the tree through
# `humantime-serde`; taken directly for `format_rfc3339_seconds`.
humantime = "2"
humantime-serde = "1.1"
petgraph = "0.8"
serde = { workspace = true }
# The progress journal is append-only NDJSON: the writer can be killed
# mid-line, and only a per-line format lets the reader drop the tear.
serde_json = { workspace = true }
shlex = "1.3"
# A retry's `wait` is a timer the scheduler itself awaits, so this is a
# runtime dependency, not just a test harness.
smol = { workspace = true }
thiserror = "2"
yaml_serde = "0.10"

# Only for killing a command node's process group: `async_process` exposes
# no `process_group`/`pre_exec`, and killing the shell alone orphans the
# gate's real work.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
