[package]
name = "daruda_store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Domain data models and persistence for daruda — panels, project state, tasks (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_core = { path = "../daruda_core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
enum-iterator = "2.1.0"
fs4 = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
