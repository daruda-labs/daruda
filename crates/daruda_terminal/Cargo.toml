[package]
name = "daruda_terminal"
version.workspace = true
edition.workspace = true
rust-version = "1.86"
publish = false
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
base64 = "0.22"
daruda_store = { path = "../daruda_store" }
ghostty_vt = { path = "../ghostty_vt" }
gpui = { workspace = true }
portable-pty = "0.9"
regex = "1.10"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
unicode-width = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "render"
harness = false
