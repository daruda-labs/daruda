# Korean translations for the vendored widgets — daruda-authored, not upstream.
#
# Kept in its own file rather than as `ko:` rows inside `ui.yml` so that
# re-vendoring stays the pure file copy `patches/README.md` describes: upstream
# owns `ui.yml`, daruda owns this one, and neither overwrites the other.
# `rust_i18n::i18n!("locales", …)` in `src/lib.rs` globs the whole directory
# (rust-i18n-support `load_locales`), so no vendored source needed a change.
#
# Wording follows `crates/app/locales/ko.yml` where the two overlap — "복사",
# "붙여넣기", "모두 선택", "취소", "확인" are the app's own terms for the same
# actions, and a user meets both in one window.
#
# NOTE: cargo does not treat this file as a build input. Editing it alone
# leaves a stale binary; touch a `.rs` under this crate (or `cargo clean -p
# gpui_component`) to force the macro to re-read it.
_version: 2
