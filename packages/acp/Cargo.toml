[package]
name = "daruda_acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "ACP (Agent Client Protocol) client core — spawns an ACP agent adapter and bridges its async connection to daruda (GPUI-free)"

[lints]
workspace = true

[dev-dependencies]
test_process = { workspace = true }

[features]
# Exposes `AcpSessionHandle::detached_for_test` to host test targets.
test-support = []

[dependencies]
daruda_core = { workspace = true }
# Subprocess launch and wire-tap LineDirection require process; Stdio is unused.
# Authentication methods are part of the stable schema. Per-turn usage still
# requires its opt-in feature to retain token accounting on prompt responses.
agent-client-protocol = { workspace = true, features = ["process", "unstable_end_turn_token_usage"] }
anyhow = { workspace = true }
futures = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
shell-words = { workspace = true }
smol = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true, default-features = false, features = ["rustls"] }
which = { workspace = true }
