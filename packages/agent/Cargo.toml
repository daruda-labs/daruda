[package]
name = "daruda_agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Agent-provider integrations: accounts, usage, activity, service status, and session state (GPUI-free)"

[lints]
workspace = true

[features]
# Read-back of `pty_tracker`'s internal state for the app's tests. Never a
# shipping default.
test-support = []

# `pty_tracker` watches the session directory. Feature selection mirrors the
# app's: `macos_fsevent` is the only opt-in backend.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { workspace = true, default-features = false, features = ["macos_fsevent"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = { workspace = true, default-features = false }

[dev-dependencies]
shell-words = { workspace = true }
test_process = { workspace = true }

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
daruda_core = { workspace = true }
daruda_store = { workspace = true }
dirs = { workspace = true }
fs4 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Which process each pane runs, for `pty_tracker`.
sysinfo = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, default-features = false, features = ["tls"] }
# A clear "claude not found" before a plugin install spawns it.
which = { workspace = true }
# Skill frontmatter, parsed losslessly.
yaml_serde = { workspace = true }
