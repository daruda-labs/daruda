[package]
name = "daruda_agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Agent-provider integrations: accounts, usage, activity, service status, and session state (GPUI-free)"

[lints]
workspace = true

[features]
# Read-back of `pty_tracker`'s internal state for the app's tests. Never a
# shipping default.
test-support = []

[dev-dependencies]
shell-words = { workspace = true }
test_process = { workspace = true }

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
daruda_core = { workspace = true }
daruda_store = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Which process each pane runs, for `pty_tracker`.
sysinfo = { workspace = true }
tempfile = { workspace = true }
# codex hook trust lives in its `config.toml`, edited in place.
toml_edit = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, default-features = false, features = ["rustls"] }
# A clear "claude not found" before a plugin install spawns it.
which = { workspace = true }
# Skill frontmatter, parsed losslessly.
yaml_serde = { workspace = true }
