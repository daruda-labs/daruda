[package]
name = "daruda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Loop Terminal — Dev loop accelerator for Claude Code"

[lints]
workspace = true

[[bin]]
name = "daruda"
path = "src/main.rs"

[features]
# Machinery shared by the visual-verification front-ends below: seeding a
# transcript into an agent-chat pane without an ACP session. Not useful alone —
# `screenshot` and `replay` each turn it on. It exists so the shared seeding path
# carries one `cfg` instead of an `any(...)` that grows a term per front-end.
devtools = ["daruda_chat/devtools"]

# `daruda --screenshot <path>` — render the live window to a PNG via gpui's
# render_to_image (upstream-gated behind test-support). Off by default to keep
# the shipping binary clean; enable for visual-verification builds:
#   cargo build -p daruda --features screenshot
screenshot = [
    "devtools",
    "gpui/test-support",
    "gpui_macos/test-support",
    "daruda_chat/screenshot",
    "daruda_settings/screenshot",
]

# `daruda --replay-acp-log <path>` — replay a captured ACP wire log into a live
# agent-chat pane for hands-on inspection. Deliberately does NOT pull in
# test-support: replay drives the ordinary running app, so it needs none of the
# offscreen-render machinery `screenshot` does.
#   cargo build -p daruda --features replay
replay = ["devtools"]

[dependencies]
daruda_core = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
dirs = { workspace = true }
sha2 = { workspace = true }
# Flow node cards say a timeout in the vocabulary the flow file uses.
humantime = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
ghostty_vt = { workspace = true }
image = { workspace = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
daruda_acp = { workspace = true }
daruda_agent = { workspace = true }
daruda_store = { workspace = true }
daruda_config = { workspace = true }
daruda_content = { workspace = true }
daruda_control_types = { workspace = true }
daruda_flow = { workspace = true }
daruda_flow_edit = { workspace = true }
daruda_project = { workspace = true }
daruda_settings = { workspace = true }
daruda_terminal = { workspace = true }
daruda_chat = { workspace = true }
daruda_transcript = { workspace = true }
daruda_ui = { workspace = true }
daruda_update = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui_component = { workspace = true }
gpui_component_assets = { workspace = true }
ignore = "0.4"
lsp-types = { workspace = true }
portable-pty = { workspace = true }
pulldown-cmark = { workspace = true, default-features = false }
rust-i18n = { workspace = true }
semver = { workspace = true }
sys-locale = "0.3"
# Named directly, not inherited: a flow run's `FlowEvent` channel is built
# here, and a transitive dependency has no name in Rust source.
smol = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
similar = { workspace = true }
shell-words = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
usvg = { version = "0.45.0", default-features = false }
unicode-segmentation = { workspace = true }
url = { workspace = true }
ureq = { workspace = true, default-features = false, features = ["rustls", "json"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { workspace = true, features = ["v4"] }
open = "5.3.5"
nucleo-matcher = "0.3.1"

# OS APIs daruda calls directly, beyond what `gpui_platform` already selects
# for the window/rendering backend — dock/taskbar attention, idle time,
# Keychain-equivalent secret storage. See packages/app/src/platform/attention.rs
# and packages/app/src/telegram/keychain.rs for the call sites. `gpui_macos` is
# also listed here (not just pulled transitively via `gpui_platform`) because
# the `screenshot` feature below references `gpui_macos/test-support` directly.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSCell", "NSControl", "NSDockTile", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSThread"] }
raw-window-handle = { workspace = true }
notify = { workspace = true, default-features = false, features = ["macos_fsevent"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `screensaver` is the X11 extension attention.rs queries for system idle time
# (XScreenSaverQueryInfo); `allow-unsafe-code` is required by x11rb's FFI shims.
# Already in the dependency tree via gpui_platform -> gpui_linux's x11 feature,
# so this only turns on one more extension — no new crate download.
x11rb = { version = "0.13.1", features = ["screensaver", "allow-unsafe-code"] }
# No Linux-specific feature needed — notify's inotify backend is unconditional;
# `macos_fsevent` is the only opt-in OS backend (default-enabled upstream,
# hence disabling default-features + opting back in only on macOS above).
notify = { workspace = true, default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.21.3", default-features = false }
raw-window-handle = { workspace = true }
windows_api = { package = "windows", version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
uds_windows = "1.2.1"
hex = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security_Authorization", "Win32_Security_Credentials",
    "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust",
    "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
    "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
    "Win32_Graphics_Gdi", "Win32_Storage_Xps",
] }
# Same reasoning as Linux: ReadDirectoryChangesW is unconditional, so there is
# no feature to opt into — only `macos_fsevent` is gated. Without this section
# the app has no `notify` at all on Windows and does not compile.
notify = { workspace = true, default-features = false }

[build-dependencies]
strings_gen = { workspace = true }
embed-resource = "3.0"

[dev-dependencies]
strings_gen = { workspace = true }
test_process = { workspace = true }
agent-client-protocol = { workspace = true }
# `test-support` swaps the PTY spawn for a stub. Declared here rather than on
# the normal dependency so only test targets get it: a workspace test that
# opens a tab would otherwise fork a real login shell.
daruda_terminal = { workspace = true, features = ["test-support"] }
# A detached session handle lets a test watch what a pane sends, and when it
# lets go, without an adapter process behind it.
daruda_acp = { workspace = true, features = ["test-support"] }
# `pty_tracker`'s state read-back the workspace tests assert on.
daruda_agent = { workspace = true, features = ["test-support"] }
# Test-only observation hooks the workspace tests read back.
daruda_chat = { workspace = true, features = ["test-support"] }
# A store that never touches the developer's own `config.toml`, and read-back
# hooks on an open Settings.
daruda_settings = { workspace = true, features = ["test-support"] }
daruda_ui = { workspace = true, features = ["test-support"] }
# Where a task log's bytes live, for a test that tears its last line.
daruda_runlog = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { workspace = true, features = ["test-support"] }
