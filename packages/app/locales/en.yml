  status_bar_usage_chip_reset: "· %{reset}"
  # Last entry in the Claude-usage dropdown — switches the right dock to
  # the Usage tab, where the same numbers are shown as gauges.
  status_bar_usage_open_panel: "Open Usage panel"
  # Usage menu header naming whose limits these are; `agent` is the auth
  # domain's label.
  status_bar_usage_menu_title: "%{agent} usage"
  # Usage menu header state: the chip's own window and percentage, so the
  # menu opens on the number the chip shows.
  status_bar_usage_menu_state: "%{window} · %{pct}%"
  # The same, when a failed refresh left the numbers on screen; `marker` is
  # `usage.stale_marker`.
  status_bar_usage_menu_state_stale: "%{window} · %{pct}% %{marker}"
  # Placeholder for an account with no captured email (shouldn't happen
  # once login captures `oauthAccount`, but the field is `Option` today).
  accounts_unknown_email: "Unknown"
  # Add-account entry, one per auth domain — `recipe` is that domain's
  # display label, so the entry names which credentials it signs into
  # instead of relying on the heading above it. Used by the Settings
  # section's buttons and by the terminal-pane status-bar dropdown, which
  # lists every domain.
  accounts_add: "+ Add %{recipe} account"
  # Success toast title after a headless add-account login finishes and
  # the account is saved.
  accounts_login_added: "Account added."
  # Toast shown in place of `settings_accounts_login_added()` when a
  # headless add-account login succeeds but its email+org matches
  # an account already tracked (`find_duplicate`'s dedup hit branch of
  # `Workspace::finish_login_success`): the fresh throwaway dir's
  # credentials are discarded, not adopted, so the existing account's
  # freshness is unchanged — this distinct copy tells the user their login
  # didn't refresh anything and points at Reauthenticate, the flow that
  # actually does.
  accounts_login_already_exists: "This account is already added — use Reauthenticate to refresh."
  # Failure toast title for a headless add-account login that didn't
  # produce a usable account — denied, timed out, the process
  # failed, or credentials weren't found after a reported success. The
  # outcome-specific detail rides in the report's untranslated `.message()`
  # (diagnostic text, same convention as the rest of the error pipeline).
  accounts_login_failed: "Could not add account."
  # Toast shown when `add_managed_account` is called while a previous
  # headless login is still in progress (`PendingLogin::InProgress`) — a
  # second concurrent login would overwrite `pending_login`'s
  # uncancellable process handle and leak the first attempt's process +
  # config dir.
  accounts_login_busy: "An account login is already in progress."
  # Authored toast-body detail for a `LoginOutcome::Denied` add-account
  # login, folded into `settings_accounts_login_failed()`'s report
  # `.message()`.
  accounts_login_denied_detail: "The OAuth consent screen was denied."
  # Authored toast-body detail for a `LoginOutcome::TimedOut` add-account
  # login, folded into `settings_accounts_login_failed()`'s report
  # `.message()`.
  accounts_login_timed_out_detail: "The login process did not complete before timing out."
  # Authored toast-body detail for an add-account login that reported
  # success but left no credentials in its config dir
  # (`AccountRecipe::has_credentials`).
  accounts_login_no_credentials_detail: "Login succeeded but no credentials were found afterward."
  # Reauthenticate counterpart of
  # `settings_accounts_login_no_credentials_detail()`.
  accounts_reauth_no_credentials_detail: "Reauthentication succeeded but no credentials were found afterward."
  # Status-bar dropdown's in-progress row, shown in place of "+ Add
  # account" while `Workspace::is_login_pending` is true.
  accounts_login_in_progress: "Adding account…"
  # Success toast title after `Workspace::reauthenticate_account` finishes
  # and the existing account's row is refreshed.
  accounts_reauth_added: "Account reauthenticated."
  # Failure toast title for a reauthenticate-account login that didn't
  # land — denied, timed out, the process failed, or credentials weren't
  # found after a reported success. Mirrors `settings_accounts_login_failed`'s
  # convention: the outcome-specific detail rides in the report's
  # untranslated `.message()`.
  accounts_reauth_failed: "Could not reauthenticate account."
  # Authored toast-body detail for `Workspace::reauthenticate_account` when
  # `account_id` no longer resolves in `self.accounts` — a concurrent
  # Settings-window delete raced the reauth dispatch. Folded into
  # `settings_accounts_reauth_failed()`'s report `.message()`.
  accounts_reauth_missing: "The account being reauthenticated no longer exists."
  # Toast title when a managed login replaced the ambient sign-in the user had
  # made themselves — every `SystemDefault` pane now runs as that account.
  accounts_ambient_login_replaced: "Your system sign-in was replaced"
  # Body for [`account_ambient_login_replaced`] — what it means and the way back.
  accounts_ambient_login_replaced_detail: "Signing in to this account also replaced the sign-in you had made yourself, so panes on the System account now run as it. Sign in again from the System row to restore it."
  # Toast title when a failed pane's re-login cannot be run by daruda: the
  # agent signs in wherever it runs, which for a remote agent is not this
  # machine.
  accounts_reauth_elsewhere: "This agent signs in where it runs"
  # Body for [`account_reauth_elsewhere`] — what to do instead.
  accounts_reauth_elsewhere_detail: "It is not running on this machine, so daruda cannot sign in for it. Open a terminal on its host, run the agent's CLI, and use its /login command."
  # Authored toast-body detail for `Workspace::reauthenticate_system` when the
  # domain cannot name its ambient home — no home directory and no config-dir
  # override, so there is nothing to sign into. Folded into
  # `settings_accounts_reauth_failed()`'s report `.message()`.
  accounts_system_home_unknown: "No home directory was found for this agent, so there is nowhere to sign in to."
  # Warning toast when a terminal pane's account config dir could not be
  # prepared. A warning rather than a blocker: the account's env still gets
  # injected, so only the mirrored extras are missing.
  accounts_prepare_dir_failed: "Could not fully set up this account's configuration directory. The pane still runs under the account, but shared resources may be missing."

