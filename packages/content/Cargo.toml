[package]
name = "daruda_content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Content processing shared by daruda's file viewer and agent chat — image decoding and mermaid rendering (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_core = { workspace = true }
anyhow = { workspace = true }
imara-diff = "0.2"
image = { workspace = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Mermaid → SVG renderer. Not vendored — no daruda-side patch needed.
# WORKAROUND: the alpha renderer permits stable layout crates with incompatible
# APIs. Keep this family together until its new rendering APIs are migrated.
merman = { version = "=0.8.0-alpha.3", features = ["render"] }
dugong = "=0.8.0-alpha.3"
manatee = "=0.8.0-alpha.3"
resvg = "0.45"
similar = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
