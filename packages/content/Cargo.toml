[package]
name = "daruda_content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Content processing shared by daruda's file viewer and agent chat — image decoding and mermaid rendering (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_core = { workspace = true }
anyhow = "1"
imara-diff = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Mermaid → SVG renderer. Not vendored — no daruda-side patch needed.
merman = { version = "0.8.0-alpha.3", features = ["render"] }
resvg = "0.45"
similar = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
url = "2"
