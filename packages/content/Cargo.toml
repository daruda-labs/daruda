[package]
name = "daruda_content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Content processing shared by daruda's file viewer and agent chat — image decoding and mermaid rendering (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_core = { workspace = true }
anyhow = { workspace = true }
imara-diff = "0.2"
image = { workspace = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Keep all diagram families; ELK is outside the repository license policy.
# Cytoscape supplies mindmap layouts while graph diagrams retain Dagre.
merman = { version = "0.9.3", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
resvg = "0.49.0"
similar = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
url = { workspace = true }
