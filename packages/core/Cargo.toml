[package]
name = "daruda_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Shared utilities and core logic for daruda — usable from both the GPUI app and the GPUI-free protocol crates"

[lints]
workspace = true

[dependencies]
dirs = { workspace = true }
percent-encoding = "2"
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
dunce = "1"
which = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
test_process = { workspace = true }
