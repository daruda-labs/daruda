[package]
name = "daruda_flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Declarative flow engine over ACP — parses, validates and runs a DAG of agent and command nodes (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_acp = { workspace = true }
daruda_core = { workspace = true }
# A run's progress is committed to an event-sourced log, so a resume restores
# numbers, outputs, invalidations and questions from one source.
daruda_runlog = { workspace = true }
# The record says when each attempt settled. Already in the tree through
# `humantime-serde`; taken directly for `format_rfc3339_seconds`.
humantime = { workspace = true }
humantime-serde = "1.1"
petgraph = "0.8"
# Two output paths differing only in Unicode normalisation are one file on
# macOS's default filesystem — verified for Latin, Hangul and kana. std has
# no normaliser, so the duplicate-output rule needs one to mean what it says.
unicode-normalization = "0.1"
serde = { workspace = true }
# The progress journal is append-only NDJSON: the writer can be killed
# mid-line, and only a per-line format lets the reader drop the tear.
serde_json = { workspace = true }
shlex = "2"
# A retry's `wait` is a timer the scheduler itself awaits, so this is a
# runtime dependency, not just a test harness.
smol = { workspace = true }
thiserror = { workspace = true }
yaml_serde = { workspace = true }

[dev-dependencies]
# The machine-law and crash harness for `FlowRunMachine`.
daruda_runlog = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

# Only for the example's SIGINT handler — a demo binary wanting Ctrl+C, not
# a capability. Everything else goes through `daruda_core::process`.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
