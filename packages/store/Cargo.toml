[package]
name = "daruda_store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Domain data models and persistence for daruda — panels, project state, tasks (GPUI-free)"

[lints]
workspace = true

[dependencies]
daruda_core = { workspace = true }
daruda_runlog = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
dirs = { workspace = true }
enum-iterator = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smol = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
ulid = { version = "3", features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The machine-law and crash harness for `TaskMachine`.
daruda_runlog = { workspace = true, features = ["test-support"] }
insta = "1"
tempfile = { workspace = true }
