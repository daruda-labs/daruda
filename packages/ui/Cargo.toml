[package]
name = "daruda_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Domain-free GPUI widgets and the theme bridge for daruda — the one home of gpui_component and ferrum_flow access"

[lints]
workspace = true

[features]
# Test-only observation hooks (inline-bounds probe, painted-cursor log,
# contrast ratio) for the app's integration tests. Never a shipping default.
test-support = []

[dependencies]
daruda_config = { workspace = true }
daruda_content = { workspace = true }
daruda_core = { workspace = true }
daruda_terminal = { workspace = true }
ferrum_flow = { workspace = true }
gpui = { workspace = true }
gpui_component = { workspace = true }
image = { version = "0.25", default-features = false }
schemars = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
tree-sitter-highlight = "0.25"
tree-sitter-python = "0.25.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
