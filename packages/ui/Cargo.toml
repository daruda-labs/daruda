[package]
name = "daruda_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Domain-free GPUI widgets and the theme bridge for daruda — the one home of gpui_component and ferrum_flow access"

[lints]
workspace = true

[features]
# Test-only observation hooks (inline-bounds probe, painted-cursor log,
# contrast ratio) and the widget-test globals, for dependent packages' tests.
# Never a shipping default.
test-support = ["gpui/test-support"]

[dependencies]
daruda_config = { workspace = true }
daruda_content = { workspace = true }
daruda_core = { workspace = true }
daruda_terminal = { workspace = true }
ferrum_flow = { workspace = true }
gpui = { workspace = true }
gpui_component = { workspace = true }
image = { workspace = true, default-features = false }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-highlight = "0.25"
tree-sitter-python = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
