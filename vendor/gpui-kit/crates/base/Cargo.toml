[package]
name = "gpui-base"
version = "0.9.0"
license = "Apache-2.0"
publish = false
edition = "2024"
autoexamples = false
autobenches = false
autotests = false
description = "Vendored gpui-base v0.9.0 (longbridge/gpui-kit, Apache-2.0). Routed through daruda workspace gpui."

[lib]
doctest = false

[lints.clippy]
all = "allow"

[lints.rust]
unused = "allow"
dead_code = "allow"

[features]
# The upstream GPUI Fast backend is not vendored; declared so its cfg gates compile out.
"gpui-fast" = []
"decimal" = ["dep:rust_decimal"]
"test-support" = ["gpui/test-support"]
"inspector" = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
"anyhow" = { workspace = true }
"aho-corasick" = { version = "1.1.3" }
"chrono" = { workspace = true, default-features = true }
"data-url" = { version = "0.3" }
"futures" = { workspace = true }
"gpui" = { workspace = true }
"gpui_macros" = { workspace = true }
"instant" = { workspace = true, features = ["wasm-bindgen"] }
"itertools" = { workspace = true }
"lsp-types" = { workspace = true, features = ["proposed"] }
"markdown" = { workspace = true, features = ["serde"] }
"html5ever" = { version = "0.27" }
"markup5ever_rcdom" = { version = "0.3.0" }
"num-traits" = { workspace = true }
"ropey" = { workspace = true, features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
"regex" = { workspace = true }
"rust_decimal" = { version = "1.37.0", optional = true }
"schemars" = { workspace = true }
"serde" = { workspace = true, features = ["derive"] }
"serde_json" = { workspace = true }
"smallvec" = { workspace = true }
"sum_tree" = { workspace = true }
"tracing" = { workspace = true }
"unicode-linebreak" = { version = "0.1.5" }
"unicode-segmentation" = { workspace = true }
"web-time" = { version = "1" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
"smol" = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
"raw-window-handle" = { workspace = true }
"objc2" = { workspace = true }
"objc2-app-kit" = { workspace = true, default-features = true, features = ["NSAccessibility", "NSView", "NSWindow", "NSWorkspace"] }
"objc2-foundation" = { workspace = true, default-features = true, features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
"windows" = { features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"], workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
"ashpd" = { version = "0.13", default-features = false, features = ["async-io", "settings"] }

[dev-dependencies]
"gpui" = { workspace = true, features = ["test-support"] }
"indoc" = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dev-dependencies]
# Native shaping tests borrow the pinned platform's text system without a window.
"gpui_platform" = { workspace = true }
