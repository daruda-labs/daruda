[package]
name = "gpui-component"
version = "0.9.0"
license = "Apache-2.0"
publish = false
edition = "2024"
autoexamples = false
autobenches = false
autotests = false
description = "Vendored gpui-component v0.9.0 (longbridge/gpui-kit, Apache-2.0). Routed through daruda workspace gpui."

[lib]
doctest = false

[lints.clippy]
all = "allow"

[lints.rust]
unused = "allow"
dead_code = "allow"

[features]
# The upstream GPUI Fast backend is not vendored; declared so its cfg gates compile out.
"gpui-fast" = []
"test-support" = ["gpui/test-support", "gpui-base/test-support"]
"decimal" = ["gpui-base/decimal"]
"inspector" = ["gpui_macros/inspector", "gpui/inspector", "gpui-base/inspector"]
"tree-sitter" = ["dep:tree-sitter", "dep:tree-sitter-json"]
"syntect" = ["dep:syntect", "dep:two-face"]
"speech" = ["dep:cpal", "dep:block2", "dep:objc2-speech", "dep:objc2-avf-audio", "dep:objc2-av-foundation", "objc2-foundation/NSBundle", "objc2-foundation/NSDictionary", "objc2-foundation/NSError", "objc2-foundation/NSLocale", "windows/Foundation_Collections", "windows/Globalization", "windows/Media_SpeechRecognition"]
"tree-sitter-languages" = ["tree-sitter-astro", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cmake", "tree-sitter-cpp", "tree-sitter-csharp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-ejs", "tree-sitter-elixir", "tree-sitter-erb", "tree-sitter-go", "tree-sitter-graphql", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-jsdoc", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make", "tree-sitter-markdown", "tree-sitter-php", "tree-sitter-proto", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-sql", "tree-sitter-svelte", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig"]
"tree-sitter-astro" = ["tree-sitter", "dep:tree-sitter-astro-next"]
"tree-sitter-bash" = ["tree-sitter", "dep:tree-sitter-bash"]
"tree-sitter-c" = ["tree-sitter", "dep:tree-sitter-c"]
"tree-sitter-cmake" = ["tree-sitter", "dep:tree-sitter-cmake"]
"tree-sitter-cpp" = ["tree-sitter", "dep:tree-sitter-cpp"]
"tree-sitter-csharp" = ["tree-sitter", "dep:tree-sitter-c-sharp"]
"tree-sitter-css" = ["tree-sitter", "dep:tree-sitter-css"]
"tree-sitter-diff" = ["tree-sitter", "dep:tree-sitter-diff"]
"tree-sitter-ejs" = ["tree-sitter", "dep:tree-sitter-embedded-template"]
"tree-sitter-elixir" = ["tree-sitter", "dep:tree-sitter-elixir"]
"tree-sitter-erb" = ["tree-sitter", "dep:tree-sitter-embedded-template"]
"tree-sitter-go" = ["tree-sitter", "dep:tree-sitter-go"]
"tree-sitter-graphql" = ["tree-sitter", "dep:tree-sitter-graphql"]
"tree-sitter-html" = ["tree-sitter", "dep:tree-sitter-html"]
"tree-sitter-java" = ["tree-sitter", "dep:tree-sitter-java"]
"tree-sitter-javascript" = ["tree-sitter", "dep:tree-sitter-javascript"]
"tree-sitter-jsdoc" = ["tree-sitter", "dep:tree-sitter-jsdoc"]
"tree-sitter-kotlin" = ["tree-sitter", "dep:tree-sitter-kotlin-sg"]
"tree-sitter-lua" = ["tree-sitter", "dep:tree-sitter-lua"]
"tree-sitter-make" = ["tree-sitter", "dep:tree-sitter-make"]
"tree-sitter-markdown" = ["tree-sitter", "dep:tree-sitter-md"]
"tree-sitter-markdown-inline" = ["tree-sitter-markdown"]
"tree-sitter-php" = ["tree-sitter", "dep:tree-sitter-php"]
"tree-sitter-proto" = ["tree-sitter", "dep:tree-sitter-proto"]
"tree-sitter-python" = ["tree-sitter", "dep:tree-sitter-python"]
"tree-sitter-ruby" = ["tree-sitter", "dep:tree-sitter-ruby"]
"tree-sitter-rust" = ["tree-sitter", "dep:tree-sitter-rust"]
"tree-sitter-scala" = ["tree-sitter", "dep:tree-sitter-scala"]
"tree-sitter-sql" = ["tree-sitter", "dep:tree-sitter-sequel"]
"tree-sitter-svelte" = ["tree-sitter", "dep:tree-sitter-svelte-next"]
"tree-sitter-swift" = ["tree-sitter", "dep:tree-sitter-swift"]
"tree-sitter-toml" = ["tree-sitter", "dep:tree-sitter-toml-ng"]
"tree-sitter-tsx" = ["tree-sitter", "dep:tree-sitter-typescript"]
"tree-sitter-typescript" = ["tree-sitter", "dep:tree-sitter-typescript"]
"tree-sitter-yaml" = ["tree-sitter", "dep:tree-sitter-yaml"]
"tree-sitter-zig" = ["tree-sitter", "dep:tree-sitter-zig"]

[dependencies]
"unicode-width" = { workspace = true }
"unicode-segmentation" = { workspace = true }
"similar" = { workspace = true, features = ["unicode"] }
"regex" = { workspace = true }
"anyhow" = { workspace = true }
"gpui" = { workspace = true }
"gpui_macros" = { workspace = true }
"gpui-base" = { workspace = true }
"gpui-component-macros" = { path = "../component-macros" }
"gpui-kit-assets" = { workspace = true }
"notify" = { workspace = true, default-features = true }
"ropey" = { workspace = true, features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
"rust-i18n" = { workspace = true }
"schemars" = { workspace = true }
"serde" = { workspace = true, features = ["derive"] }
"serde_json" = { workspace = true }
"serde_repr" = { workspace = true }
"smallvec" = { workspace = true }
"sum_tree" = { workspace = true }
"tracing" = { workspace = true }
"log" = { workspace = true }
"markdown" = { workspace = true, features = ["serde"] }
"enum-iterator" = { workspace = true }
"itertools" = { workspace = true }
"once_cell" = { version = "1.19.0" }
"paste" = { version = "1" }
"uuid" = { workspace = true }
"num-traits" = { workspace = true }
"chrono" = { workspace = true, default-features = true }
"lsp-types" = { workspace = true, features = ["proposed"] }
"syntect" = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"], optional = true }
"two-face" = { version = "0.4.5", default-features = false, features = ["syntect-fancy"], optional = true }
"instant" = { workspace = true, features = ["wasm-bindgen"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
"smol" = { workspace = true }
"cpal" = { version = "0.15.3", optional = true }
"tree-sitter" = { workspace = true, optional = true }
"tree-sitter-astro-next" = { version = "0.1.1", optional = true }
"tree-sitter-bash" = { workspace = true, optional = true }
"tree-sitter-c" = { version = "0.24.1", optional = true }
"tree-sitter-c-sharp" = { version = "0.23.1", optional = true }
"tree-sitter-cmake" = { version = "0.7.1", optional = true }
"tree-sitter-cpp" = { version = "0.23.4", optional = true }
"tree-sitter-css" = { version = "0.23.2", optional = true }
"tree-sitter-diff" = { version = "0.1.0", optional = true }
"tree-sitter-elixir" = { version = "0.3", optional = true }
"tree-sitter-embedded-template" = { version = "0.23.0", optional = true }
"tree-sitter-go" = { version = "0.23.4", optional = true }
"tree-sitter-graphql" = { version = "0.1.0", optional = true }
"tree-sitter-html" = { version = "0.23.2", optional = true }
"tree-sitter-java" = { version = "0.23.5", optional = true }
"tree-sitter-javascript" = { version = "0.23.1", optional = true }
"tree-sitter-jsdoc" = { version = "0.23.2", optional = true }
"tree-sitter-json" = { version = "0.24.8", optional = true }
"tree-sitter-kotlin-sg" = { version = "0.4.0", optional = true }
"tree-sitter-lua" = { version = "0.4.1", optional = true }
"tree-sitter-make" = { version = "1.1.1", optional = true }
"tree-sitter-md" = { version = "0.5.1", optional = true }
"tree-sitter-php" = { version = "0.24.2", optional = true }
"tree-sitter-proto" = { version = "0.2.0", optional = true }
"tree-sitter-python" = { workspace = true, optional = true }
"tree-sitter-ruby" = { version = "0.23.1", optional = true }
"tree-sitter-rust" = { version = "0.24.0", optional = true }
"tree-sitter-scala" = { version = "0.23.4", optional = true }
"tree-sitter-sequel" = { version = "0.3.8", optional = true }
"tree-sitter-svelte-next" = { version = "0.1.1", optional = true }
"tree-sitter-swift" = { version = "0.7.0", optional = true }
"tree-sitter-toml-ng" = { version = "0.7.0", optional = true }
"tree-sitter-typescript" = { version = "0.23.2", optional = true }
"tree-sitter-yaml" = { workspace = true, optional = true }
"tree-sitter-zig" = { version = "1.1.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
"core-text" = { version = "=21.0.0" }
"raw-window-handle" = { workspace = true }
"objc2" = { workspace = true }
"objc2-app-kit" = { workspace = true, default-features = true, features = ["NSMenu", "NSMenuItem", "NSView", "NSWindow", "NSResponder", "NSEvent", "NSImage"] }
"objc2-foundation" = { workspace = true, default-features = true, features = ["NSData", "NSString", "NSGeometry"] }
"block2" = { version = "0.6", optional = true }
"objc2-av-foundation" = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat"], optional = true }
"objc2-avf-audio" = { version = "0.3", default-features = false, features = ["std", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"], optional = true }
"objc2-speech" = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognitionMetadata", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
"raw-window-handle" = { workspace = true }
"resvg" = { version = "0.45.1" }
"windows" = { features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"], workspace = true }

[dev-dependencies]
"gpui" = { workspace = true, features = ["test-support"] }
"indoc" = { workspace = true }
"gpui-base" = { workspace = true, features = ["test-support"] }
