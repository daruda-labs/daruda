[workspace]
members = ["crates/gpui"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.86"
async-task = "4.7"
async-tungstenite = "0.33"
backtrace = "0.3"
bitflags = "2.6.0"
env_logger = "0.11"
etagere = "0.2"
futures = "0.3.34"
futures-concurrency = "7.7.1"
heapless = "0.9.2"
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
objc2 = "0.6"
parking_lot = "0.12.1"
pollster = "0.4.0"
profiling = "1"
raw-window-handle = "0.6"
slotmap = "1.0.6"
smol = "2.0"
stacksafe = "1.0"
thiserror = "2.0.12"
unicode-segmentation = "1.10"
url = "2.2"
wasm-bindgen = "0.2.120"
web-sys = "0.3"
web-time = "1.1.0"

[workspace.dependencies.accesskit]
features = ["enumn"]
version = "0.24.0"

[workspace.dependencies.async-channel]
default-features = false
version = "2.5"

[workspace.dependencies.bench_metrics]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.chrono]
default-features = false
features = [
    "std",
    "serde",
]
version = "0.4"

[workspace.dependencies.collections]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"
version = "0.1.0"

[workspace.dependencies.criterion]
features = ["html_reports"]
version = "0.8.2"

[workspace.dependencies.derive_more]
features = [
    "deref",
    "deref_mut",
    "from_str",
]
version = "2.1"

[workspace.dependencies.gpui_macros]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.gpui_platform]
default-features = false
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.gpui_shared_string]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.gpui_util]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.gpui_web]
default-features = false
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.hdrhistogram]
default-features = false
version = "7"

[workspace.dependencies.http_client]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.icu_segmenter]
default-features = false
features = ["compiled_data"]
version = "2.3.0"

[workspace.dependencies.image]
default-features = false
features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
]
version = "0.25.1"

[workspace.dependencies.log]
default-features = false
features = ["std"]
version = "0.4"

[workspace.dependencies.objc2-core-foundation]
default-features = false
version = "=0.3.2"

[workspace.dependencies.objc2-core-video]
default-features = false
features = [
    "CVBuffer",
    "CVImageBuffer",
]
version = "=0.3.2"

[workspace.dependencies.postage]
default-features = false
version = "0.5"

[workspace.dependencies.proptest]
features = ["attr-macro"]
version = "1.12.0"

[workspace.dependencies.rand]
default-features = false
features = [
    "std",
    "std_rng",
    "os_rng",
]
version = "0.9"

[workspace.dependencies.refineable]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.regex]
default-features = false
features = [
    "std",
    "perf",
]
version = "1.5"

[workspace.dependencies.reqwest_client]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.resvg]
default-features = false
features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
]
version = "0.46.0"

[workspace.dependencies.scap]
default-features = false
git = "https://github.com/zed-industries/scap"
package = "zed-scap"
rev = "b5c86ec58dd4b6b7732bf6ac8be03d6b1f190a82"
version = "0.0.8-zed"

[workspace.dependencies.scheduler]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.schemars]
default-features = false
features = [
    "std",
    "indexmap2",
]
version = "1.0"

[workspace.dependencies.serde]
features = ["rc"]
version = "1.0"

[workspace.dependencies.serde_json]
features = [
    "preserve_order",
    "raw_value",
]
version = "1.0.144"

[workspace.dependencies.smallvec]
features = [
    "union",
    "const_new",
]
version = "1.6"

[workspace.dependencies.spin]
default-features = false
features = [
    "mutex",
    "spin_mutex",
    "lock_api",
]
version = "0.10"

[workspace.dependencies.strum]
features = ["derive"]
version = "0.28"

[workspace.dependencies.sum_tree]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.taffy]
default-features = false
version = "=0.15.0"

[workspace.dependencies.usvg]
default-features = false
version = "0.46.0"

[workspace.dependencies.util_macros]
git = "https://github.com/zed-industries/zed"
rev = "decd2399b180b64dea2a4182f9ac63545a45e7a3"

[workspace.dependencies.uuid]
features = ["serde"]
version = "1.1"

[workspace.dependencies.windows]
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]
version = "0.62"

[workspace.lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.lints.clippy.style]
level = "allow"
priority = -1

[workspace.lints.rust.unexpected_cfgs]
level = "allow"

[workspace.package]
edition = "2024"
publish = false
